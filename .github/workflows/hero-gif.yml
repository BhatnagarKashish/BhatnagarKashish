name: Build hero GIF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["assets/make_gif.py", ".github/workflows/hero-gif.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python assets/make_gif.py
      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.gif
          git diff --cached --quiet || git commit -m "Build hero GIF"
          git push
