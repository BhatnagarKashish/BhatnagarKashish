name: Build banner GIF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["banner/**", ".github/workflows/banner.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install fonts, ffmpeg and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter fonts-dejavu-core ffmpeg
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Render frames
        run: node banner/render.js
      - name: Encode GIF
        run: |
          ffmpeg -y -loglevel error -framerate 12.5 -i banner/frames/f%03d.png \
            -vf "split[a][b];[a]palettegen=max_colors=160:stats_mode=full[p];[b][p]paletteuse=dither=sierra2_4a" \
            -loop 0 assets/banner.gif
      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.gif
          git diff --cached --quiet || git commit -m "Build banner GIF"
          git push
